name: Cover reference commits
on:
  push:
    branches: [sol/audit-update-03]
    paths: [.github/workflows/audit-source.yml]
permissions:
  contents: write
jobs:
  cover-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push two isolated cover references
        run: |
          git checkout -b sol/cover-timing 99d1ed28bb3e9a3a8ce695c28624edd14e4aedb2
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
            ('leafDurMul = REDUCED ? 1.1 : 1.18;', 'leafDurMul = isMag() ? (REDUCED ? 1.1 : 1.18) : 1.0;'),
            ('var e = leafMaterial === "board" ? easeHeavy(raw) : easeInOutSine(raw);', 'var e = easeInOutSine(raw); // EXPERIMENT: board uses the same sine timing as paper')
          ]
          for old,new in replacements:
              assert s.count(old)==1, old
              s=s.replace(old,new)
          p.write_text(s)
          Path('NOTES-cover-timing.md').write_text("""# Cover timing reference A — rigid, sine
          
          Base: main @ 99d1ed28bb3e9a3a8ce695c28624edd14e4aedb2, v13.57.
          Tried: Hardcover board multiplier 1.0 with sine easing, leafFlex 0.
          Normal-motion full turn is 950 ms (formerly 950 * 1.18 = 1121 ms).
          The reduced-motion base duration is preserved and now also uses multiplier 1.0.
          Magazine retains its original duration/easing; paper remains unchanged.
          
          Found: this isolates the heavy board timing from board geometry. No measured
          feel improvement is claimed. The camera targets and camera easing code,
          artwork, 64 strips, bend integral and all shadow formulas/multipliers
          are unchanged. Camera duration follows the same existing leafDurMul input.
          This is a reference diff for comparison, not a ship candidate.
          
          Validation: replacement counts, inline-script parse, exact allowlisted
          diff against main. Device visual comparison remains required.
          Recommend: compare A against main on iPhone, including forward/back cover
          turns and partial drags. The known partial-drag glide bug is preserved.
          No WebGL/CSS-3D retrial; keep the Canvas 2D opacity protection.
          """)
          PY
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          let count=0;for(const m of fs.readFileSync('index.html','utf8').matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)){new vm.Script(m[1]);count++;}
          console.log({variant:'A',inlineScriptsParsed:count});
          JS
          git diff --check
          git add index.html NOTES-cover-timing.md
          git commit -m "EXPERIMENT: rigid cover reference at 950ms sine"
          git push origin HEAD:refs/heads/sol/cover-timing
          git rev-parse HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='if (leafMaterial === "board") { leafFlex = 0;'
          assert s.count(old)==1
          s=s.replace(old,'if (leafMaterial === "board") { leafFlex = isMag() ? 0 : 0.2;')
          p.write_text(s)
          with Path('NOTES-cover-timing.md').open('a') as f:
              f.write("""
          
          ## Cover timing reference B — partial flex
          
          Same as A, with Hardcover board leafFlex 0.2 (one fifth of paper).
          Maximum tip angular lag is 24 degrees * 0.2 = 4.8 degrees at mid-turn.
          Magazine stays at flex 0. Board face shading/highlight remain suppressed.
          No shadow formula or strength is changed; the existing cast-shadow formula
          follows the newly bent tip, so its position changes with geometry.
          Baseline comments describing all boards as rigid apply to main/reference A;
          this deliberately isolated experiment is the documented exception.
          
          Found: this separates a small bend from timing; it is not a paper-like
          full-flex cover. This is a reference diff, not a ship candidate.
          Validation: exact single source replacement from A, parse and diff checks.
          Recommend: compare A/B on real iPhone for perceived stiffness, edge shape,
          end-turn fade and under-page bleed; no device result is claimed.
          """)
          PY
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          let count=0;for(const m of fs.readFileSync('index.html','utf8').matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)){new vm.Script(m[1]);count++;}
          console.log({variant:'B',inlineScriptsParsed:count});
          const cp=require('child_process'),assert=require('assert/strict');
          const baseline=cp.execFileSync('git',['show','99d1ed28:index.html'],{maxBuffer:40*1024*1024}).toString();
          const expected=baseline
            .replace('leafDurMul = REDUCED ? 1.1 : 1.18;','leafDurMul = isMag() ? (REDUCED ? 1.1 : 1.18) : 1.0;')
            .replace('var e = leafMaterial === "board" ? easeHeavy(raw) : easeInOutSine(raw);','var e = easeInOutSine(raw); // EXPERIMENT: board uses the same sine timing as paper')
            .replace('if (leafMaterial === "board") { leafFlex = 0;','if (leafMaterial === "board") { leafFlex = isMag() ? 0 : 0.2;');
          assert.equal(fs.readFileSync('index.html','utf8'),expected);
          console.log('Exact allowlisted source diff verified; no artwork, camera or shadow formula edits.');
          JS
          git diff --check
          git add index.html NOTES-cover-timing.md
          git commit -m "EXPERIMENT: cover reference with modest 0.2 flex"
          git push origin HEAD:refs/heads/sol/cover-timing
          git rev-parse HEAD
